# Base mise config shipped with the image.
# Copied to the user HOME on first boot if missing — never overwrites existing custom config.

[tools]
node = "22"
python = "3.13"
uv = "latest"

[settings]
experimental = true
yes = true

# --- Orca runtime (updatable without image rebuild) ---

[tasks."orca:update"]
description = "Download/upgrade Orca AppImage into persistent HOME (no image rebuild)"
run = "/scripts/update-orca.sh"

[tasks."orca:status"]
description = "Show installed Orca version and install path"
run = "/scripts/update-orca.sh --status"

[tasks."orca:rollback"]
description = "Roll back to previous Orca extract"
run = "/scripts/update-orca.sh --rollback"

# --- agent maintenance ---

[tasks."agents:doctor"]
description = "Check installed AI CLIs and runtimes"
run = "/scripts/doctor.sh"

[tasks."agents:versions"]
description = "Print runtime and agent versions"
run = "/scripts/versions.sh"

[tasks."agents:update"]
description = "Update AI CLIs via official mechanisms (no image rebuild)"
run = "echo 'agents:update: implement per-agent updaters (Phase F) — see docs/IMPLEMENTATION_PLAN.md §71'"
