# Orca remote workstation: Tailscale sidecar + orca sharing net namespace.
# No host port publishing by default — access via Tailnet / MagicDNS.
#
# Orca binary lives in the orca-home volume and is upgraded without image rebuild:
#   docker compose exec orca /scripts/update-orca.sh
#   docker compose restart orca
#
# Optional internal Docker (separate daemon — NOT host docker.sock):
#   COMPOSE_PROFILES=dind docker compose up -d
#   → service "docker" (DinD) shares Tailscale netns; CLI uses DOCKER_HOST=tcp://127.0.0.1:2375

services:
  tailscale:
    image: tailscale/tailscale:${TAILSCALE_VERSION:-latest}
    container_name: orca-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-orca-dev}
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: ${TAILSCALE_HOSTNAME:-orca-dev}
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "tailscale status --json >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Separate Docker daemon (DinD). Privileged ONLY here — never on Orca.
  # Shares Tailscale netns so Orca reaches the API on loopback (not published on Tailnet).
  docker:
    profiles: ["dind"]
    image: docker:${DOCKER_DIND_VERSION:-27-dind}
    container_name: orca-docker
    network_mode: "service:tailscale"
    privileged: true
    environment:
      # Empty = no TLS; we bind 127.0.0.1 only (see command).
      DOCKER_TLS_CERTDIR: ""
    command:
      - dockerd
      - --host=unix:///var/run/docker.sock
      - --host=tcp://127.0.0.1:2375
      - --storage-driver=overlay2
      - --tls=false
    volumes:
      - docker-data:/var/lib/docker
      # Same workspace path as Orca so `docker build /workspace/...` works
      - workspace:/workspace
    depends_on:
      tailscale:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  orca:
    build:
      context: .
      args:
        ORCA_VERSION: ${ORCA_VERSION:-latest}
        ORCA_SHA256: ${ORCA_SHA256:-}
        ORCA_SEED_IN_IMAGE: ${ORCA_SEED_IN_IMAGE:-false}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        MISE_VERSION: ${MISE_VERSION:-}
        NODE_VERSION: ${NODE_VERSION:-22}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
        UV_VERSION: ${UV_VERSION:-latest}
        DOCKER_CLI_VERSION: ${DOCKER_CLI_VERSION:-27.5.1}
        DOCKER_COMPOSE_VERSION: ${DOCKER_COMPOSE_VERSION:-2.32.4}
        INSTALL_CLAUDE: ${INSTALL_CLAUDE:-true}
        INSTALL_CODEX: ${INSTALL_CODEX:-true}
        INSTALL_GEMINI: ${INSTALL_GEMINI:-true}
        INSTALL_CURSOR: ${INSTALL_CURSOR:-true}
        INSTALL_OPENCODE: ${INSTALL_OPENCODE:-true}
        INSTALL_GROK: ${INSTALL_GROK:-false}
        INSTALL_HERMES: ${INSTALL_HERMES:-false}
        INSTALL_QWEN: ${INSTALL_QWEN:-false}
        INSTALL_KIMI: ${INSTALL_KIMI:-false}
    # Build locally by default; set ORCA_IMAGE=ghcr.io/chameleonbr/orca-server:latest
    # in .env to pull the published image instead (docker compose pull orca).
    image: ${ORCA_IMAGE:-orca-server:local}
    container_name: orca-server
    network_mode: "service:tailscale"
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      HOME: /home/orca
      ORCA_PORT: ${ORCA_PORT:-6768}
      ORCA_VERSION: ${ORCA_VERSION:-latest}
      ORCA_PAIRING_ADDRESS: ${ORCA_PAIRING_ADDRESS:-}
      ORCA_INSTALL_DIR: /home/orca/.local/share/orca
      # mup: all scheduling inside the container (supercronic) — nothing on host
      MUP_SCHEDULE: ${MUP_SCHEDULE:-true}
      MUP_CRON: ${MUP_CRON:-"15 4 * * *"}
      MUP_ON_BOOT: ${MUP_ON_BOOT:-false}
      TZ: ${TZ:-America/Sao_Paulo}
      AUTO_UPDATE_ALL: ${AUTO_UPDATE_ALL:-false}
      AUTO_UPDATE_ORCA: ${AUTO_UPDATE_ORCA:-false}
      AUTO_UPDATE_AGENTS: ${AUTO_UPDATE_AGENTS:-false}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-orca-dev}
      LIBGL_ALWAYS_SOFTWARE: "1"
      # Docker client → internal DinD (profile dind). Loopback only in shared netns.
      DOCKER_HOST: ${DOCKER_HOST:-tcp://127.0.0.1:2375}
      # Git identity (also applied by entrypoint → ~/.gitconfig on volume)
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
      GIT_INIT_DEFAULT_BRANCH: ${GIT_INIT_DEFAULT_BRANCH:-main}
      INSTALL_CLAUDE: ${INSTALL_CLAUDE:-true}
      INSTALL_CODEX: ${INSTALL_CODEX:-true}
      INSTALL_GEMINI: ${INSTALL_GEMINI:-true}
      INSTALL_CURSOR: ${INSTALL_CURSOR:-true}
      INSTALL_OPENCODE: ${INSTALL_OPENCODE:-true}
      INSTALL_GROK: ${INSTALL_GROK:-false}
      INSTALL_HERMES: ${INSTALL_HERMES:-false}
      INSTALL_QWEN: ${INSTALL_QWEN:-false}
      INSTALL_KIMI: ${INSTALL_KIMI:-false}
      CURSOR_INSTALL_URL: ${CURSOR_INSTALL_URL:-https://cursor.com/install}
      OPENCODE_INSTALL_URL: ${OPENCODE_INSTALL_URL:-https://opencode.ai/install}
    volumes:
      # HOME holds: agent creds, mise, AND the updatable Orca runtime
      - orca-home:/home/orca
      - workspace:/workspace
    restart: unless-stopped
    # First boot may download ~200MB AppImage into the volume
    stop_grace_period: 30s

  # LEGACY / last resort: mount host Docker socket (root-equivalent on host).
  # Prefer profile "dind" (separate daemon). Enable: COMPOSE_PROFILES=docker-access
  orca-docker-access:
    profiles: ["docker-access"]
    extends:
      service: orca
    container_name: orca-server-docker
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - orca-home:/home/orca
      - workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  tailscale-state:
  orca-home:
  workspace:
  docker-data:
